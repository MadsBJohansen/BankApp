<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bank Account</title>
    <link rel="stylesheet" th:href="@{/bankAccounts.css}">
</head>
<body>
<h1>Create Bank Account</h1>
<form class="form-modify" th:action="@{/bankAccounts/createBankAccount}" th:object="${bankAccount}" method="post">
    <label for="accountNumber"> Account Number </label>
    <input type="text" id="accountNumber" pattern="\d{8}" maxlength="8" th:field="*{accountNumber}" placeholder="Enter account number" required>

    <label for="name"> Name </label>
    <input type="text" id="name" th:field="*{name}" placeholder="Enter name" required>
    <button type="submit" class="">Create Bank Account</button>
</form>


</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts</title>
    <link rel="stylesheet" th:href="@{/bankAccountsCLAUDE.css}">
</head>
<body>

<nav class="nav">
    <a class="nav-logo" th:href="@{/}">Bunch Bank</a>
    <a th:href="@{/bankAccounts}">Accounts</a>
</nav>

<main class="page">
    <div class="page-header">
        <h1>Accounts</h1>
        <a class="btn" th:href="@{/bankAccounts/showCreateBankAccount}">+ New account</a>
    </div>

    <div class="account-grid">
        <a class="card account-card"
           th:each="bankAccount : ${bankAccounts}"
           th:href="@{/bankAccounts/{accountNumber}/showBankAccount(accountNumber=${bankAccount.accountNumber})}">
            <span class="account-name" th:text="${bankAccount.name}">Name</span>
            <span class="account-number" th:text="|No. ${bankAccount.accountNumber}|">No. 12345678</span>
            <span class="account-balance"
                  th:text="|${#numbers.formatDecimal(bankAccount.balance, 1, 'POINT', 2, 'COMMA')} kr.|">0,00 kr.</span>
        </a>
    </div>
</main>

</body>
</html>
